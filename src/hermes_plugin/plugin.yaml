name: hcom
version: "0.2.0"
description: "Bridge this Hermes session into an hcom agent mesh: bind identity, drain pending hcom messages into the model context at turn assembly (pre_llm_call), report tool and turn activity, and register a notify port for launch readiness and wake pings. A ping with unread messages submits a `<hcom>` wake envelope through inject_message so an idle session starts a turn and drains; delivery is still turn-assembly based, never a mid-turn push."
author: "hcom"
# requires_hermes intentionally omitted: upstream builds have shipped
# broken version strings (nix 2026.9.24 build reports 0.0.0), which would
# fail any >= gate while the code itself is current. The plugin only uses
# stable hook names; capability issues surface at registration instead.
provides_hooks:
  - on_session_start
  - pre_llm_call
  - post_llm_call
  - post_tool_call
  - on_session_end
  - on_session_reset
